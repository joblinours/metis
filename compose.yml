name: metis-suite

x-app: &app
  env_file:
    - path: .env
      format: raw
  restart: unless-stopped
  networks:
    - metis

services:
  sqld:
    image: ${SQLD_IMAGE:-ghcr.io/tursodatabase/libsql-server:latest@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67}
    profiles: ["sqld"]
    restart: unless-stopped
    command: ["/bin/sqld", "--enable-namespaces"]
    environment:
      SQLD_AUTH_JWT_KEY: ${SQLD_AUTH_JWT_KEY:-}
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:9090
      LIBSQL_ADMIN_AUTH_KEY: ${SQLD_ADMIN_KEY:-}
    ports:
      - "127.0.0.1::9090"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 30s
    volumes:
      - metis_sqld:/var/lib/sqld
    networks:
      metis:
        aliases:
          - app.sqld
          - mastra.sqld

  preflight:
    <<: *app
    image: ${PREFLIGHT_IMAGE:-ghcr.io/trymetis/metis:latest-preflight}
    restart: "no"
    depends_on:
      sqld:
        condition: service_healthy
        required: false

  app:
    <<: *app
    image: ${APP_IMAGE:-ghcr.io/trymetis/metis:latest}
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      METIS_UPDATER_SOCKET: /run/metis-updater/updater.sock
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - metis_updater:/run/metis-updater:ro
    stop_grace_period: 30s

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/trymetis/metis:latest-updater}
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-3000}
      METIS_INSTALL_DIR: ${METIS_INSTALL_DIR:-/opt/metis-suite}
      METIS_UPDATER_SOCKET: /run/metis-updater/updater.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${METIS_INSTALL_DIR:-/opt/metis-suite}:${METIS_INSTALL_DIR:-/opt/metis-suite}
      - metis_updater:/run/metis-updater
    networks:
      - metis

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: ["proxy"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${METIS_DOMAIN:-}", "--to", "app:3000"]
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - metis_caddy_data:/data
      - metis_caddy_config:/config
    networks:
      - metis

volumes:
  metis_caddy_data:
  metis_caddy_config:
  metis_sqld:
  metis_updater:

networks:
  metis:
    driver: bridge
