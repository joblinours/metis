listen=YES
listen_ipv6=NO
listen_port=990
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/run/vsftpd/empty
pam_service_name=vsftpd

pasv_enable=YES
pasv_min_port=30010
pasv_max_port=30019
max_per_ip=6
max_clients=12

ssl_enable=YES
implicit_ssl=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
rsa_cert_file=/etc/vsftpd/tls/ftp.localhost.crt
rsa_private_key_file=/etc/vsftpd/tls/ftp.localhost.key

seccomp_sandbox=NO
isolate_network=NO
